name: Test Hexbound
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check frontend/app.js
      - run: node --check frontend/studio.js
      - run: node --check frontend/account.js
      - run: npm ci
      - run: npm run test:ui
      - run: npm run test:studio
      - run: npm run test:accounts
      - run: npm run test:rooms
      - run: npm run test:combat
